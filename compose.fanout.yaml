# Loaded by start.sh when two or more local backends are selected.
# Replaces the collector command so configs merge and pipeline lists append.
# start.sh rewrites the --config lines for the selected modes; the two-file
# example below is the openobserve + openlit default shape.
services:
  otel-collector:
    command:
      - --feature-gates=confmap.enableMergeAppendOption
      - --config=file:/etc/otelcol-contrib/config.openobserve.yaml
      - --config=file:/etc/otelcol-contrib/config.openlit.yaml
