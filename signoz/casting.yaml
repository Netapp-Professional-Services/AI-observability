# Source for the vendored stack in this directory.
# Regenerate with foundryctl, then re-apply the adaptations in docs/signoz.md.
# Foundry v0.4.0 emits :latest; these tags match that digest as of this vendor.
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  signoz:
    spec:
      image: signoz/signoz:v0.148.1
  ingester:
    spec:
      image: signoz/signoz-otel-collector:v0.144.15
