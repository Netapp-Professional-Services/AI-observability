# SigNoz stack vendored from Foundry v0.4.0 (signoz/casting.yaml).
# Adaptations: profile signoz, project network (no signoz-network), UI host
# port only, pinned images, and startup order for the migrator.
# Included from the root compose.yaml. Do not publish 4317/4318 or ClickHouse.

services:
  signoz-telemetrykeeper-clickhousekeeper-0:
    profiles:
      - signoz
    container_name: signoz-telemetrykeeper-clickhousekeeper-0
    image: clickhouse/clickhouse-keeper:25.12.5
    restart: unless-stopped
    entrypoint:
      - /usr/bin/clickhouse-keeper
      - --config-file=/etc/clickhouse-keeper/keeper.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
        - CMD
        - clickhouse-keeper-client
        - -h
        - localhost
        - -p
        - "9181"
        - -q
        - ls
      timeout: 10s
    volumes:
      - ${SIGNOZ_KEEPER_DATA_DIR:-signoz-keeper-data}:/var/lib/clickhouse-keeper
      # Image also declares VOLUME /var/lib/clickhouse. An explicit mount
      # replaces the anonymous volume Docker would create. Keeper does not write here.
      - ${SIGNOZ_KEEPER_CLICKHOUSE_DIR:-signoz-keeper-clickhouse}:/var/lib/clickhouse
      - ./telemetrykeeper/clickhousekeeper/keeper-0.yaml:/etc/clickhouse-keeper/keeper.yaml:ro

  signoz-telemetrystore-clickhouse-user-scripts:
    profiles:
      - signoz
    container_name: signoz-telemetrystore-clickhouse-user-scripts
    image: clickhouse/clickhouse-server:25.12.5
    restart: on-failure
    command:
      - bash
      - -c
      - |-
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mkdir -p /var/lib/clickhouse/user_scripts
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      # Same directory as the ClickHouse server. One mount covers the image
      # VOLUME, and histogramQuantile lands in user_scripts/ inside it.
      - ${SIGNOZ_CLICKHOUSE_DATA_DIR:-signoz-clickhouse-data}:/var/lib/clickhouse

  signoz-telemetrystore-clickhouse-0-0:
    profiles:
      - signoz
    container_name: signoz-telemetrystore-clickhouse-0-0
    image: clickhouse/clickhouse-server:25.12.5
    restart: unless-stopped
    depends_on:
      signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
      - CLICKHOUSE_CONFIG=/etc/clickhouse-server/config-0-0.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8123/ping
      timeout: 10s
    volumes:
      - ${SIGNOZ_CLICKHOUSE_DATA_DIR:-signoz-clickhouse-data}:/var/lib/clickhouse
      - ./telemetrystore/clickhouse/config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
      - ./telemetrystore/clickhouse/functions.yaml:/etc/clickhouse-server/functions.yaml:ro

  signoz-telemetrystore-migrator:
    profiles:
      - signoz
    container_name: signoz-telemetrystore-migrator
    image: signoz/signoz-otel-collector:v0.144.15
    restart: on-failure
    depends_on:
      signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m

  signoz-metastore-postgres-0:
    profiles:
      - signoz
    container_name: signoz-metastore-postgres-0
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${SIGNOZ_POSTGRES_DB:-signoz}
      - POSTGRES_USER=${SIGNOZ_POSTGRES_USER:-signoz}
      - POSTGRES_PASSWORD=${SIGNOZ_POSTGRES_PASSWORD:-signoz}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      timeout: 10s
    volumes:
      - ${SIGNOZ_POSTGRES_DATA_DIR:-signoz-postgres-data}:/var/lib/postgresql/data

  signoz-signoz-0:
    profiles:
      - signoz
    container_name: signoz-signoz-0
    image: signoz/signoz:v0.148.1
    restart: unless-stopped
    depends_on:
      signoz-metastore-postgres-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy
    environment:
      - SIGNOZ_SQLSTORE_PROVIDER=postgres
      - SIGNOZ_SQLSTORE_POSTGRES_DSN=postgres://${SIGNOZ_POSTGRES_USER:-signoz}:${SIGNOZ_POSTGRES_PASSWORD:-signoz}@signoz-metastore-postgres-0:5432/${SIGNOZ_POSTGRES_DB:-signoz}?sslmode=disable
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
    ports:
      - "${SIGNOZ_UI_PORT:-8080}:8080"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8080/api/v1/health
      timeout: 10s

  signoz-ingester:
    profiles:
      - signoz
    container_name: signoz-ingester
    image: signoz/signoz-otel-collector:v0.144.15
    restart: unless-stopped
    depends_on:
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
      signoz-signoz-0:
        condition: service_started
    entrypoint:
      - /bin/sh
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/opamp-config.yaml --copy-path=/var/tmp/collector-config.yaml
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
      # Required by clickhousetraces in ingester.yaml; unset fails config load.
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
    volumes:
      - ./ingester/ingester.yaml:/etc/otel-collector-config.yaml:ro
      - ./ingester/opamp.yaml:/etc/opamp-config.yaml:ro

volumes:
  signoz-keeper-data:
  signoz-keeper-clickhouse:
  signoz-clickhouse-data:
  signoz-postgres-data:
