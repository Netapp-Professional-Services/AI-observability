# Gateway collector → OpenLIT (OTLP gRPC on openlit:4317).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
exporters:
  # OpenLIT's first-party OTLP receiver (gRPC). Host ports stay on this gateway.
  otlp/openlit:
    endpoint: ${env:OPENLIT_OTLP_ENDPOINT}
    tls:
      insecure: true
    compression: gzip
    timeout: 30s
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/openlit, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/openlit]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/openlit, debug]
  telemetry:
    logs:
      level: info
