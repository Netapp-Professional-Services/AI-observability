# Gateway collector → custom OTLP/HTTP backend.
# CUSTOM_OTLP_HTTP_ENDPOINT=http(s)://host:port[/path] (OpenObserve-style base URL).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  resource:
    attributes:
      - key: service.namespace
        value: docstream
        action: upsert

exporters:
  otlphttp/custom:
    endpoint: ${env:CUSTOM_OTLP_HTTP_ENDPOINT}
    headers:
      Authorization: ${env:CUSTOM_OTLP_AUTH_HEADER}
    compression: gzip
    timeout: 30s
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/custom, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/custom]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/custom, debug]
  telemetry:
    logs:
      level: info
