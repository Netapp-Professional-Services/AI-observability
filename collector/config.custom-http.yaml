# Gateway collector → custom OTLP/HTTP backend.
# CUSTOM_OTLP_HTTP_ENDPOINT=http(s)://host:port[/path] (OpenObserve-style base URL).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Default is 4 MiB, which rejects trace batches that include prompt content.
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 128

exporters:
  otlphttp/custom:
    endpoint: ${env:CUSTOM_OTLP_HTTP_ENDPOINT}
    headers:
      Authorization: ${env:CUSTOM_OTLP_AUTH_HEADER}
    compression: gzip
    timeout: 30s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/custom]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/custom]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/custom]
  telemetry:
    logs:
      level: info
