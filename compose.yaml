# OTLP gateway with pluggable backend profiles.
#
# Profiles (one or more local backends, or custom alone):
#   openobserve       — self-hosted OpenObserve + gateway
#   openlit           — OpenLIT + ClickHouse + gateway
#   victoriametrics   — VictoriaMetrics (metrics) + gateway
#   prometheus        — Prometheus (metrics) + gateway
#   grafana           — Grafana UI only (no gateway)
#   signoz            — SigNoz (ClickHouse, Keeper, Postgres) + gateway
#   custom            — gateway only → CUSTOM_OTLP_* endpoint
#
# Start: ./scripts/start.sh <mode> [mode ...]   (./scripts/start.sh --help)
# Stop:  ./scripts/stop.sh
# Fan-out command: compose.fanout.yaml (appends selected collector configs).
# SigNoz services: signoz/compose.yaml (included below).

name: ${COMPOSE_PROJECT_NAME:-ai-observability}

include:
  - path: signoz/compose.yaml

services:
  otel-collector:
    profiles:
      - openobserve
      - openlit
      - victoriametrics
      - prometheus
      - signoz
      - custom
    image: otel/opentelemetry-collector-contrib:0.163.2
    container_name: otel-collector
    restart: unless-stopped
    command:
      # Fan-out replaces this command.
      - --config=file:/etc/otelcol-contrib/${COLLECTOR_CONFIG:-}
    environment:
      - OPENOBSERVE_OTLP_ENDPOINT=${OPENOBSERVE_OTLP_ENDPOINT:-}
      - OPENOBSERVE_AUTH_HEADER=${OPENOBSERVE_AUTH_HEADER:-}
      - OPENOBSERVE_ORGANIZATION=${OPENOBSERVE_ORGANIZATION:-}
      - OPENOBSERVE_TLS_INSECURE=${OPENOBSERVE_TLS_INSECURE:-true}
      - OPENLIT_OTLP_ENDPOINT=${OPENLIT_OTLP_ENDPOINT:-openlit:4317}
      - VICTORIAMETRICS_OTLP_METRICS_ENDPOINT=${VICTORIAMETRICS_OTLP_METRICS_ENDPOINT:-}
      - VICTORIAMETRICS_TLS_INSECURE=${VICTORIAMETRICS_TLS_INSECURE:-true}
      - PROMETHEUS_OTLP_METRICS_ENDPOINT=${PROMETHEUS_OTLP_METRICS_ENDPOINT:-}
      - PROMETHEUS_TLS_INSECURE=${PROMETHEUS_TLS_INSECURE:-true}
      - SIGNOZ_OTLP_ENDPOINT=${SIGNOZ_OTLP_ENDPOINT:-signoz-ingester:4317}
      - CUSTOM_OTLP_GRPC_ENDPOINT=${CUSTOM_OTLP_GRPC_ENDPOINT:-}
      - CUSTOM_OTLP_HTTP_ENDPOINT=${CUSTOM_OTLP_HTTP_ENDPOINT:-}
      - CUSTOM_OTLP_AUTH_HEADER=${CUSTOM_OTLP_AUTH_HEADER:-}
      - CUSTOM_OTLP_INSECURE=${CUSTOM_OTLP_INSECURE:-true}
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health
    volumes:
      - ${OBSERVABILITY_DIR:-.}/collector:/etc/otelcol-contrib:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  openobserve:
    profiles:
      - openobserve
    image: public.ecr.aws/zinclabs/openobserve:v0.14.5
    container_name: openobserve
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-root@example.com}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD}
      - ZO_DATA_DIR=/data
    volumes:
      - ${OPENOBSERVE_DATA_DIR:-openobserve-data}:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  openlit-clickhouse:
    profiles:
      - openlit
    image: clickhouse/clickhouse-server:24.4.1
    container_name: openlit-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=${OPENLIT_DB_USER:-default}
      - CLICKHOUSE_PASSWORD=${OPENLIT_DB_PASSWORD:-OPENLIT}
      - CLICKHOUSE_DATABASE=${OPENLIT_DB_NAME:-openlit}
      - CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS=true
    volumes:
      - ${OPENLIT_CLICKHOUSE_DATA_DIR:-openlit-clickhouse-data}:/var/lib/clickhouse
      - ./openlit/assets/clickhouse-config.xml:/etc/clickhouse-server/config.d/custom-config.xml:ro
      - ./openlit/assets/clickhouse-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "9000:9000"
      - "8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 100s

  openlit:
    profiles:
      - openlit
    image: ghcr.io/openlit/openlit:2.1.0
    container_name: openlit
    restart: unless-stopped
    environment:
      - TELEMETRY_ENABLED=true
      - INIT_DB_HOST=openlit-clickhouse
      - INIT_DB_PORT=8123
      - INIT_DB_DATABASE=${OPENLIT_DB_NAME:-openlit}
      - INIT_DB_USERNAME=${OPENLIT_DB_USER:-default}
      - INIT_DB_PASSWORD=${OPENLIT_DB_PASSWORD:-OPENLIT}
      - SQLITE_DATABASE_URL=file:/app/client/data/data.db
      - PORT=${OPENLIT_UI_PORT:-3001}
      - DOCKER_PORT=${OPENLIT_UI_PORT:-3001}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "${OPENLIT_UI_PORT:-3001}:${OPENLIT_UI_PORT:-3001}"
      # OTLP stays internal — clients send to otel-collector, which fans in here.
    depends_on:
      openlit-clickhouse:
        condition: service_healthy
    volumes:
      - ${OPENLIT_DATA_DIR:-openlit-data}:/app/client/data
      - ./openlit/assets/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
      # OpenLIT 2.1.0 drops the ClickHouse log id and looks the row up with a
      # different hash, so the detail pane renders empty. These overlays keep
      # the real id. They match image ghcr.io/openlit/openlit:2.1.0 only.
      - ./openlit/assets/openlit-patches/server/chunks/7838.js:/app/client/.next/server/chunks/7838.js:ro
      - ./openlit/assets/openlit-patches/server/app/api/telemetry/logs/route.js:/app/client/.next/server/app/api/telemetry/logs/route.js:ro
      - ./openlit/assets/openlit-patches/server/app/api/telemetry/logs/[id]/route.js:/app/client/.next/server/app/api/telemetry/logs/[id]/route.js:ro
      - ./openlit/assets/openlit-patches/server/app/api/telemetry/logs/attribute-keys/route.js:/app/client/.next/server/app/api/telemetry/logs/attribute-keys/route.js:ro
      - ./openlit/assets/openlit-patches/server/app/api/telemetry/logs/config/route.js:/app/client/.next/server/app/api/telemetry/logs/config/route.js:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3001)).then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  victoriametrics:
    profiles:
      - victoriametrics
    image: victoriametrics/victoria-metrics:v1.119.0
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${VICTORIAMETRICS_RETENTION:-30d}
      - -httpListenAddr=:8428
      - -opentelemetry.usePrometheusNaming
    ports:
      - "${VICTORIAMETRICS_UI_PORT:-8428}:8428"
    volumes:
      - ${VICTORIAMETRICS_DATA_DIR:-victoriametrics-data}:/storage

  prometheus:
    profiles:
      - prometheus
    image: prom/prometheus:v3.11.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-otlp-receiver
      - --web.listen-address=:9090
    ports:
      - "${PROMETHEUS_UI_PORT:-9090}:9090"
    volumes:
      - ${PROMETHEUS_DATA_DIR:-prometheus-data}:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    profiles:
      - grafana
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ${GRAFANA_DATA_DIR:-grafana-data}:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/grafana:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  openobserve-data:
  openlit-clickhouse-data:
  openlit-data:
  victoriametrics-data:
  prometheus-data:
  grafana-data:
