# OTLP gateway with pluggable backend profiles.
#
# Profiles (one backend, or OpenObserve together with OpenLIT):
#   openobserve       — self-hosted OpenObserve + gateway
#   openlit           — OpenLIT + ClickHouse + gateway
#   custom            — gateway only → CUSTOM_OTLP_* endpoint
#
# Start: ./scripts/start.sh openobserve|openlit|custom
#        ./scripts/start.sh openobserve openlit
# Stop:  ./scripts/stop.sh
# Fan-out command: compose.fanout.yaml (appends both collector configs).

name: ${COMPOSE_PROJECT_NAME:-ai-observability}

services:
  otel-collector:
    profiles:
      - openobserve
      - openlit
      - custom
    image: otel/opentelemetry-collector-contrib:0.163.2
    container_name: otel-collector
    restart: unless-stopped
    command:
      # Fan-out replaces this command.
      - --config=file:/etc/otelcol-contrib/${COLLECTOR_CONFIG:-}
    environment:
      - OPENOBSERVE_OTLP_ENDPOINT=${OPENOBSERVE_OTLP_ENDPOINT:-}
      - OPENOBSERVE_AUTH_HEADER=${OPENOBSERVE_AUTH_HEADER:-}
      - OPENOBSERVE_ORGANIZATION=${OPENOBSERVE_ORGANIZATION:-}
      - OPENOBSERVE_TLS_INSECURE=${OPENOBSERVE_TLS_INSECURE:-true}
      - OPENLIT_OTLP_ENDPOINT=${OPENLIT_OTLP_ENDPOINT:-openlit:4317}
      - CUSTOM_OTLP_GRPC_ENDPOINT=${CUSTOM_OTLP_GRPC_ENDPOINT:-}
      - CUSTOM_OTLP_HTTP_ENDPOINT=${CUSTOM_OTLP_HTTP_ENDPOINT:-}
      - CUSTOM_OTLP_AUTH_HEADER=${CUSTOM_OTLP_AUTH_HEADER:-}
      - CUSTOM_OTLP_INSECURE=${CUSTOM_OTLP_INSECURE:-true}
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health
    volumes:
      - ${OBSERVABILITY_DIR:-.}/collector:/etc/otelcol-contrib:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  openobserve:
    profiles:
      - openobserve
    image: public.ecr.aws/zinclabs/openobserve:v0.14.5
    container_name: openobserve
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-root@example.com}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD}
      - ZO_DATA_DIR=/data
    volumes:
      - ${OPENOBSERVE_DATA_DIR:-openobserve-data}:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  openlit-clickhouse:
    profiles:
      - openlit
    image: clickhouse/clickhouse-server:24.4.1
    container_name: openlit-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=${OPENLIT_DB_USER:-default}
      - CLICKHOUSE_PASSWORD=${OPENLIT_DB_PASSWORD:-OPENLIT}
      - CLICKHOUSE_DATABASE=${OPENLIT_DB_NAME:-openlit}
      - CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS=true
    volumes:
      - ${OPENLIT_CLICKHOUSE_DATA_DIR:-openlit-clickhouse-data}:/var/lib/clickhouse
      - ./openlit/assets/clickhouse-config.xml:/etc/clickhouse-server/config.d/custom-config.xml:ro
      - ./openlit/assets/clickhouse-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "9000:9000"
      - "8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 100s

  openlit:
    profiles:
      - openlit
    image: ghcr.io/openlit/openlit:2.1.0
    container_name: openlit
    restart: unless-stopped
    environment:
      - TELEMETRY_ENABLED=true
      - INIT_DB_HOST=openlit-clickhouse
      - INIT_DB_PORT=8123
      - INIT_DB_DATABASE=${OPENLIT_DB_NAME:-openlit}
      - INIT_DB_USERNAME=${OPENLIT_DB_USER:-default}
      - INIT_DB_PASSWORD=${OPENLIT_DB_PASSWORD:-OPENLIT}
      - SQLITE_DATABASE_URL=file:/app/client/data/data.db
      - PORT=${OPENLIT_UI_PORT:-3000}
      - DOCKER_PORT=${OPENLIT_UI_PORT:-3000}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "${OPENLIT_UI_PORT:-3000}:${OPENLIT_UI_PORT:-3000}"
      # OTLP stays internal — clients send to otel-collector, which fans in here.
    depends_on:
      openlit-clickhouse:
        condition: service_healthy
    volumes:
      - ${OPENLIT_DATA_DIR:-openlit-data}:/app/client/data
      - ./openlit/assets/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
      # OpenLIT 2.1.0 drops the ClickHouse log id and looks the row up with a
      # different hash, so the detail pane renders empty. These overlays keep
      # the real id. They match image ghcr.io/openlit/openlit:2.1.0 only.
      - ./openlit/assets/openlit-patches/server/chunks/7838.js:/app/client/.next/server/chunks/7838.js:ro
      - ./openlit/assets/openlit-patches/server/app/api/telemetry/logs/route.js:/app/client/.next/server/app/api/telemetry/logs/route.js:ro
      - ./openlit/assets/openlit-patches/server/app/api/telemetry/logs/[id]/route.js:/app/client/.next/server/app/api/telemetry/logs/[id]/route.js:ro
      - ./openlit/assets/openlit-patches/server/app/api/telemetry/logs/attribute-keys/route.js:/app/client/.next/server/app/api/telemetry/logs/attribute-keys/route.js:ro
      - ./openlit/assets/openlit-patches/server/app/api/telemetry/logs/config/route.js:/app/client/.next/server/app/api/telemetry/logs/config/route.js:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)).then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  openobserve-data:
  openlit-clickhouse-data:
  openlit-data:
