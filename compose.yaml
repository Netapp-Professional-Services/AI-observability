# OTLP gateway with pluggable backend profiles.
#
# Profiles (pick one backend UI/store):
#   openobserve       — self-hosted OpenObserve + gateway
#   openobserve-cloud — gateway only → OpenObserve Cloud
#   openlit           — OpenLIT + ClickHouse + gateway
#   custom            — gateway only → CUSTOM_OTLP_* endpoint
#
# Start: ./scripts/start.sh openobserve|openobserve-cloud|openlit|custom
# Aliases: local → openobserve, cloud → openobserve-cloud

name: ${COMPOSE_PROJECT_NAME:-ai-observability}

services:
  otel-collector:
    profiles:
      - openobserve
      - openobserve-cloud
      - openlit
      - custom
    image: docker.io/otel/opentelemetry-collector-contrib:0.114.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      - OPENOBSERVE_OTLP_ENDPOINT=${OPENOBSERVE_OTLP_ENDPOINT:-}
      - OPENOBSERVE_AUTH_HEADER=${OPENOBSERVE_AUTH_HEADER:-}
      - OPENLIT_OTLP_ENDPOINT=${OPENLIT_OTLP_ENDPOINT:-openlit:4317}
      - CUSTOM_OTLP_GRPC_ENDPOINT=${CUSTOM_OTLP_GRPC_ENDPOINT:-}
      - CUSTOM_OTLP_HTTP_ENDPOINT=${CUSTOM_OTLP_HTTP_ENDPOINT:-}
      - CUSTOM_OTLP_AUTH_HEADER=${CUSTOM_OTLP_AUTH_HEADER:-}
      - CUSTOM_OTLP_INSECURE=${CUSTOM_OTLP_INSECURE:-true}
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # health
    volumes:
      - ${OBSERVABILITY_DIR:-.}/collector/${COLLECTOR_CONFIG:-config.openobserve.yaml}:/etc/otelcol/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  openobserve:
    profiles:
      - openobserve
    image: public.ecr.aws/zinclabs/openobserve:v0.14.5
    container_name: openobserve
    restart: unless-stopped
    ports:
      - "5080:5080"
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_ROOT_USER_EMAIL:-root@example.com}
      - ZO_ROOT_USER_PASSWORD=${ZO_ROOT_USER_PASSWORD}
      - ZO_DATA_DIR=/data
    volumes:
      - ${OPENOBSERVE_DATA_DIR:-openobserve-data}:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Simplified OpenLIT stack (realtime/NATS disabled). Gateway owns host :4317/:4318.
  clickhouse:
    profiles:
      - openlit
    image: clickhouse/clickhouse-server:24.4.1
    container_name: clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=${OPENLIT_DB_USER:-default}
      - CLICKHOUSE_PASSWORD=${OPENLIT_DB_PASSWORD:-OPENLIT}
      - CLICKHOUSE_DB=${OPENLIT_DB_NAME:-openlit}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  openlit:
    profiles:
      - openlit
    image: ghcr.io/openlit/openlit:latest
    container_name: openlit
    restart: unless-stopped
    environment:
      - TELEMETRY_ENABLED=true
      - INIT_DB_HOST=clickhouse
      - INIT_DB_PORT=8123
      - INIT_DB_DATABASE=${OPENLIT_DB_NAME:-openlit}
      - INIT_DB_USERNAME=${OPENLIT_DB_USER:-default}
      - INIT_DB_PASSWORD=${OPENLIT_DB_PASSWORD:-OPENLIT}
      - SQLITE_DATABASE_URL=file:/app/client/data/data.db
      # Disable realtime findings so we do not need a NATS sidecar.
      - NATS_URL=
      - PORT=3000
      - DOCKER_PORT=3000
    ports:
      - "${OPENLIT_UI_PORT:-3000}:3000"
      # OTLP stays internal — clients send to otel-collector, which fans in here.
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - openlit-data:/app/client/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([fetch('http://127.0.0.1:3000'),fetch('http://127.0.0.1:4318/health')]).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

volumes:
  openobserve-data:
  clickhouse-data:
  openlit-data:
